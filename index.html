<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <div class="header__content">
        <img
          class="header__image"
          src="./eisenhower-matrix.jpg"
          alt="The Eisenhower Matrix"
        />
        <a
          class="header__link"
          href="https://goal-life.com/page/method/matrix-eisenhower"
        >
          Want more details?
        </a>
      </div>
    </header>

    <main class="main-page">
      <section class="add-section">
        <label class="add-section__title" for="new-task">Add Item</label>
        <div class="add-section__controls">
          <input id="new-task" class="add-section__input" type="text" />
          <button class="button button--add" type="button">Add</button>
        </div>
      </section>

      <section class="task-section">
        <h3 class="task-section__title">Todo</h3>

        <ul id="incompleteTasks" class="task-list task-section__list">
          <li class="task-list__item">
            <input
              class="task-list__checkbox"
              type="checkbox"
              aria-label="Mark Pay Bills as completed"
            />
            <label class="task-list__label">Pay Bills</label>
            <input class="task-list__input" type="text" />
            <button class="button button--edit" type="button">Edit</button>
            <button class="button button--delete" type="button">
              <img class="button__icon" src="./remove.svg" alt="Delete task" />
            </button>
          </li>

          <li class="task-list__item task-list__item--editing">
            <input
              class="task-list__checkbox"
              type="checkbox"
              aria-label="Mark Go Shopping as completed"
            />
            <label class="task-list__label">Go Shopping</label>
            <input class="task-list__input" type="text" value="Go Shopping" />
            <button class="button button--edit" type="button">Save</button>
            <button class="button button--delete" type="button">
              <img class="button__icon" src="./remove.svg" alt="Delete task" />
            </button>
          </li>
        </ul>
      </section>

      <section class="task-section">
        <h3 class="task-section__title">Completed</h3>

        <ul id="completed-tasks" class="task-list task-section__list">
          <li class="task-list__item">
            <input
              class="task-list__checkbox"
              type="checkbox"
              checked
              aria-label="Mark See the Doctor as incomplete"
            />
            <label class="task-list__label task-list__label--completed"
              >See the Doctor</label
            >
            <input class="task-list__input" type="text" />
            <button class="button button--edit" type="button">Edit</button>
            <button class="button button--delete" type="button">
              <img class="button__icon" src="./remove.svg" alt="Delete task" />
            </button>
          </li>
        </ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
